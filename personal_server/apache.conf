
<VirtualHost *:80>
    ServerName 172.19.0.1
    ServerAdmin admin@172.19.0.1
    DocumentRoot "C:\Progage"
    
    WSGIScriptAlias / "C:\Progage/progage/wsgi.py"
    WSGIPythonPath "C:\Progage"
    
    <Directory "C:\Progage">
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>
    
    Alias /static C:\Progage/staticfiles/
    <Directory "C:\Progage/staticfiles/">
        Require all granted
    </Directory>
    
    Alias /media C:\Progage/mediafiles/
    <Directory "C:\Progage/mediafiles/">
        Require all granted
    </Directory>
</VirtualHost>
