{% extends 'base.html' %}
{% load static %}

{% block title %}{{ title }} - Progage{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row mb-4">
        <div class="col-12">
            <h1 class="display-6 fw-bold"><i class="fas fa-database text-primary me-3"></i>{{ title }}</h1>
        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label" for="backup_type">Тип бэкапа</label>
                    <select class="form-select" name="backup_type" id="backup_type">
                        <option value="full">Полный</option>
                        <option value="db">Только БД</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="description">Описание</label>
                    <textarea class="form-control" name="description" id="description" rows="3"></textarea>
                </div>
                <div class="d-flex justify-content-between">
                    <a class="btn btn-outline-secondary" href="{% url 'adminpanel:backup_logs' %}"><i class="fas fa-arrow-left me-2"></i>Назад</a>
                    <button class="btn btn-primary" type="submit"><i class="fas fa-play me-2"></i>Создать</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
