{% extends 'base.html' %}
{% load static %}

{% block title %}{{ title }} - Progage{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row mb-4">
        <div class="col-12">
            <h1 class="display-5 fw-bold"><i class="fas fa-book text-primary me-3"></i>{{ title }}</h1>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white py-3">
                    <h5 class="mb-0">{% if course %}Редактирование{% else %}Создание{% endif %} курса</h5>
                </div>
                <div class="card-body">
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="id_title" class="form-label">Название курса</label>
                            <input type="text" class="form-control" id="id_title" name="title" value="{{ form.title.value|default:'' }}" required>
                        </div>

                        <div class="mb-3">
                            <label for="id_description" class="form-label">Описание</label>
                            <textarea class="form-control" id="id_description" name="description" rows="4" required>{{ form.description.value|default:'' }}</textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="id_instructor" class="form-label">Преподаватель</label>
                                <select class="form-select" id="id_instructor" name="instructor" required>
                                    {% for user in instructors %}
                                    <option value="{{ user.id }}" {% if form.instructor.value == user.id %}selected{% endif %}>
                                        {{ user.get_full_name|default:user.username }}
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="id_category" class="form-label">Категория</label>
                                <select class="form-select" id="id_category" name="category">
                                    <option value="">-- Выберите категорию --</option>
                                    {% for category in categories %}
                                    <option value="{{ category.id }}" {% if form.category.value == category.id %}selected{% endif %}>
                                        {{ category.name }}
                                    </option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="id_level" class="form-label">Уровень сложности</label>
                                <select class="form-select" id="id_level" name="level" required>
                                    <option value="beginner" {% if form.level.value == 'beginner' %}selected{% endif %}>Начальный</option>
                                    <option value="intermediate" {% if form.level.value == 'intermediate' %}selected{% endif %}>Средний</option>
                                    <option value="advanced" {% if form.level.value == 'advanced' %}selected{% endif %}>Продвинутый</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="id_price" class="form-label">Цена (₽)</label>
                                <input type="number" class="form-control" id="id_price" name="price" value="{{ form.price.value|default:0 }}" min="0" step="0.01">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="id_thumbnail" class="form-label">Превью курса</label>
                            <input type="file" class="form-control" id="id_thumbnail" name="thumbnail" accept="image/*">
                            {% if course and course.thumbnail %}
                            <div class="mt-2">
                                <img src="{{ course.thumbnail.url }}" alt="Текущее превью" class="rounded" style="width: 150px; height: 100px; object-fit: cover;">
                            </div>
                            {% endif %}
                        </div>

                        <div class="mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="id_is_published" name="is_published" {% if form.is_published.value %}checked{% endif %}>
                                <label class="form-check-label" for="id_is_published">
                                    Опубликовать курс
                                </label>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="{% url 'adminpanel:course_list' %}" class="btn btn-outline-secondary">
                                <i class="fas fa-arrow-left me-2"></i>Назад
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-2"></i>Сохранить
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
