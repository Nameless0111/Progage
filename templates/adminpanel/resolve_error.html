{% extends 'base.html' %}
{% load static %}

{% block title %}{{ title }} - Progage{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row mb-4">
        <div class="col-12">
            <h1 class="display-6 fw-bold"><i class="fas fa-check text-success me-3"></i>{{ title }}</h1>
        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body">
            <p class="mb-2"><strong>ID:</strong> {{ error.id }}</p>
            <p class="mb-2"><strong>Тип:</strong> {{ error.get_error_type_display }}</p>
            <p class="mb-4"><strong>Сообщение:</strong> {{ error.message }}</p>

            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-between">
                    <a class="btn btn-outline-secondary" href="{% url 'adminpanel:error_logs' %}"><i class="fas fa-arrow-left me-2"></i>Назад</a>
                    <button class="btn btn-success" type="submit"><i class="fas fa-check me-2"></i>Отметить решенной</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
