{% extends 'base.html' %}
{% load static %}

{% block title %}{{ title }} - Progage{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row mb-4">
        <div class="col-12">
            <h1 class="display-6 fw-bold"><i class="fas fa-trash text-danger me-3"></i>{{ title }}</h1>
        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body">
            <p class="mb-2">
                Удалить комментарий пользователя <strong>{{ comment.user.username }}</strong>
                к уроку <strong>{{ comment.lesson.title }}</strong>?
            </p>
            <div class="alert alert-light border mb-4">{{ comment.content }}</div>
            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-between">
                    <a class="btn btn-outline-secondary" href="{% url 'adminpanel:comment_list' %}">
                        <i class="fas fa-arrow-left me-2"></i>Назад
                    </a>
                    <button class="btn btn-danger" type="submit">
                        <i class="fas fa-trash me-2"></i>Удалить
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
