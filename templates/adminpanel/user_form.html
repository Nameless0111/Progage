{% extends 'base.html' %}
{% load static %}

{% block title %}{{ title }} - Progage{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row mb-4">
        <div class="col-12">
            <h1 class="display-5 fw-bold"><i class="fas fa-user text-primary me-3"></i>{{ title }}</h1>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white py-3">
                    <h5 class="mb-0">{% if user %}Редактирование{% else %}Создание{% endif %} пользователя</h5>
                </div>
                <div class="card-body">
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="id_username" class="form-label">Имя пользователя</label>
                                <input type="text" class="form-control" id="id_username" name="username" value="{{ form.username.value|default:'' }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="id_email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="id_email" name="email" value="{{ form.email.value|default:'' }}" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="id_first_name" class="form-label">Имя</label>
                                <input type="text" class="form-control" id="id_first_name" name="first_name" value="{{ form.first_name.value|default:'' }}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="id_last_name" class="form-label">Фамилия</label>
                                <input type="text" class="form-control" id="id_last_name" name="last_name" value="{{ form.last_name.value|default:'' }}">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="id_role" class="form-label">Роль</label>
                                <select class="form-select" id="id_role" name="role" required>
                                    <option value="student" {% if form.role.value == 'student' %}selected{% endif %}>Студент</option>
                                    <option value="teacher" {% if form.role.value == 'teacher' %}selected{% endif %}>Преподаватель</option>
                                    <option value="admin" {% if form.role.value == 'admin' %}selected{% endif %}>Администратор</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="id_phone" class="form-label">Телефон</label>
                                <input type="tel" class="form-control" id="id_phone" name="phone" value="{{ form.phone.value|default:'' }}">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="id_bio" class="form-label">О себе</label>
                            <textarea class="form-control" id="id_bio" name="bio" rows="3">{{ form.bio.value|default:'' }}</textarea>
                        </div>

                        <div class="mb-3">
                            <label for="id_avatar" class="form-label">Аватар</label>
                            <input type="file" class="form-control" id="id_avatar" name="avatar" accept="image/*">
                            {% if user and user.avatar %}
                            <div class="mt-2">
                                <img src="{{ user.avatar_url }}" alt="Текущий аватар" class="rounded" style="width: 100px; height: 100px; object-fit: cover;">
                            </div>
                            {% endif %}
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="id_password" class="form-label">{% if user %}Новый пароль (оставьте пустым, чтобы не менять){% else %}Пароль{% endif %}</label>
                                <input type="password" class="form-control" id="id_password" name="password" {% if not user %}required{% endif %}>
                            </div>
                            <div class="col-md-6 mb-3">
                                <div class="form-check mt-4">
                                    <input class="form-check-input" type="checkbox" id="id_is_active" name="is_active" {% if form.is_active.value %}checked{% endif %}>
                                    <label class="form-check-label" for="id_is_active">
                                        Активный пользователь
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="{% url 'adminpanel:user_list' %}" class="btn btn-outline-secondary">
                                <i class="fas fa-arrow-left me-2"></i>Назад
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-2"></i>Сохранить
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
