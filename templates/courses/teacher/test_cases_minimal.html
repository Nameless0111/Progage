<!-- Минимальная механика тестовых случаев -->
<div class="card border-0 shadow-sm">
    <div class="card-header bg-white py-3">
        <h5 class="mb-0">
            <i class="fas fa-vial text-primary me-2"></i>
            Тестовые случаи
        </h5>
    </div>
    <div class="card-body">
        <div id="test-cases-container">
            {% for test_case in test_cases %}
            <div class="mb-3 p-3 border rounded" data-index="{{ forloop.counter0 }}">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h6 class="mb-0">Тест {{ forloop.counter }}</h6>
                    <button type="button" class="btn btn-sm btn-outline-danger" onclick="this.parentElement.parentElement.remove()">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
                <div class="row">
                    <div class="col-md-6">
                        <label class="form-label">Входные данные</label>
                        <textarea name="test_input_{{ forloop.counter0 }}" class="form-control" rows="2">{{ test_case.input }}</textarea>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Ожидаемый вывод</label>
                        <textarea name="test_output_{{ forloop.counter0 }}" class="form-control" rows="2">{{ test_case.expected_output }}</textarea>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
        
        <div class="mt-3">
            <button type="button" class="btn btn-outline-primary" onclick="addNewTest()">
                <i class="fas fa-plus me-2"></i>Добавить тест
            </button>
        </div>
    </div>
</div>

<script>
let testIndex = {{ test_cases|length }};

function addNewTest() {
    const container = document.getElementById('test-cases-container');
    const currentCount = container.children.length;
    
    const newTest = document.createElement('div');
    newTest.className = 'mb-3 p-3 border rounded';
    newTest.setAttribute('data-index', currentCount);
    
    newTest.innerHTML = `
        <div class="d-flex justify-content-between align-items-center mb-2">
            <h6 class="mb-0">Тест ${currentCount + 1}</h6>
            <button type="button" class="btn btn-sm btn-outline-danger" onclick="this.parentElement.parentElement.remove()">
                <i class="fas fa-trash"></i>
            </button>
        </div>
        <div class="row">
            <div class="col-md-6">
                <label class="form-label">Входные данные</label>
                <textarea name="test_input_${currentCount}" class="form-control" rows="2"></textarea>
            </div>
            <div class="col-md-6">
                <label class="form-label">Ожидаемый вывод</label>
                <textarea name="test_output_${currentCount}" class="form-control" rows="2"></textarea>
            </div>
        </div>
    `;
    
    container.appendChild(newTest);
    console.log(`Added test case with index ${currentCount}`);
}

// Автоматически добавляем один тест если нет тестов
document.addEventListener('DOMContentLoaded', function() {
    const container = document.getElementById('test-cases-container');
    if (container.children.length === 0) {
        addNewTest();
    }
});
</script>
