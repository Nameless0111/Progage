{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow">
                <div class="card-header bg-danger text-white">
                    <h5 class="mb-0">Удаление урока</h5>
                </div>
                <div class="card-body">
                    <p>Вы уверены, что хотите удалить урок <strong>"{{ lesson.title }}"</strong>?</p>
                    <p class="text-muted">Тип: {{ lesson.get_lesson_type_display }}</p>
                    <p class="text-muted">Это действие нельзя отменить.</p>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'accounts:manage_lessons' course.id %}" class="btn btn-secondary">Отмена</a>
                            <button type="submit" class="btn btn-danger">
                                <i class="fas fa-trash me-1"></i>Удалить урок
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
