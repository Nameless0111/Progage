version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=progage
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5432:5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  web:
    build: 
      context: .
      dockerfile: Dockerfile.prod
    command: gunicorn --config gunicorn.conf.py progage.wsgi:application
    volumes:
      - staticfiles:/app/staticfiles
      - mediafiles:/app/mediafiles
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      - DJANGO_SETTINGS_MODULE=progage.production
    env_file:
      - .env
    restart: unless-stopped

  daphne:
    build: 
      context: .
      dockerfile: Dockerfile.prod
    command: daphne -b 0.0.0.0 -p 8001 progage.asgi:application
    volumes:
      - staticfiles:/app/staticfiles
      - mediafiles:/app/mediafiles
    ports:
      - "8001:8001"
    depends_on:
      - db
      - redis
    environment:
      - DJANGO_SETTINGS_MODULE=progage.production
    env_file:
      - .env
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - staticfiles:/app/staticfiles
      - mediafiles:/app/mediafiles
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - web
      - daphne
    restart: unless-stopped

volumes:
  postgres_data:
  staticfiles:
  mediafiles:
