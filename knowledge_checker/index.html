<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Checker - Вход</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .auth-container {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 40px;
            max-width: 500px;
            margin: 0 auto;
            max-height: 90vh;
            overflow-y: auto;
        }
        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .auth-header h1 {
            color: #667eea;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .auth-header p {
            color: #666;
            margin: 0;
        }
        .role-selector {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }
        .role-btn {
            flex: 1;
            padding: 15px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            background: white;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: #333;
        }
        .role-btn:hover {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.05);
        }
        .role-btn.active {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.1);
            color: #667eea;
        }
        .form-container {
            display: none;
        }
        .form-container.active {
            display: block;
        }
        .form-floating {
            margin-bottom: 15px;
        }
        .btn-auth {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-auth:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .alert-custom {
            border-radius: 10px;
            margin-bottom: 20px;
        }
        @media (max-width: 576px) {
            .auth-container {
                padding: 20px;
                margin: 10px;
            }
            .role-selector {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1><i class="fas fa-graduation-cap me-3"></i>Knowledge Checker</h1>
            <p>Система проверки знаний для образовательной платформы</p>
        </div>

        <div class="role-selector">
            <a href="#" class="role-btn student active" onclick="showStudentForm(event)">
                <i class="fas fa-user-graduate me-2"></i>
                <strong>Студент</strong>
            </a>
            
            <a href="#" class="role-btn teacher" onclick="showTeacherForm(event)">
                <i class="fas fa-chalkboard-teacher me-2"></i>
                <strong>Преподаватель</strong>
            </a>
        </div>

        <div id="student-form" class="form-container active">
            <h5 class="mb-4">
                <i class="fas fa-user-graduate me-2 text-primary"></i>Вход для студента
            </h5>
            
            <div id="student-alert" class="alert alert-danger alert-custom" style="display: none;"></div>
            
            <form onsubmit="handleStudentLogin(event)">
                <div class="form-floating">
                    <input type="text" class="form-control" id="student-username" placeholder="Группа" value="group1" required>
                    <label for="student-username">Группа</label>
                </div>
                
                <div class="form-floating">
                    <input type="password" class="form-control" id="student-password" placeholder="Пароль" value="password123" required>
                    <label for="student-password">Пароль</label>
                </div>
                
                <button type="submit" class="btn-auth mt-3">
                    <i class="fas fa-sign-in-alt me-2"></i>Войти как студент
                </button>
            </form>
        </div>

        <div id="teacher-form" class="form-container">
            <h5 class="mb-4">
                <i class="fas fa-chalkboard-teacher me-2 text-success"></i>Вход для преподавателя
            </h5>
            
            <div id="teacher-alert" class="alert alert-danger alert-custom" style="display: none;"></div>
            
            <form onsubmit="handleTeacherLogin(event)">
                <div class="form-floating">
                    <input type="text" class="form-control" id="teacher-username" placeholder="Имя пользователя" value="admin" required>
                    <label for="teacher-username">Имя пользователя</label>
                </div>
                
                <div class="form-floating">
                    <input type="password" class="form-control" id="teacher-password" placeholder="Пароль" value="admin123" required>
                    <label for="teacher-password">Пароль</label>
                </div>
                
                <button type="submit" class="btn-auth mt-3">
                    <i class="fas fa-sign-in-alt me-2"></i>Войти как преподаватель
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function showStudentForm(event) {
            if (event) event.preventDefault();
            
            document.querySelectorAll('.role-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector('.role-btn.student').classList.add('active');
            
            document.querySelectorAll('.form-container').forEach(form => form.classList.remove('active'));
            document.getElementById('student-form').classList.add('active');
        }
        
        function showTeacherForm(event) {
            if (event) event.preventDefault();
            
            document.querySelectorAll('.role-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector('.role-btn.teacher').classList.add('active');
            
            document.querySelectorAll('.form-container').forEach(form => form.classList.remove('active'));
            document.getElementById('teacher-form').classList.add('active');
        }
        
        function showAlert(formId, message, type = 'danger') {
            const alertElement = document.getElementById(formId + '-alert');
            alertElement.className = `alert alert-${type} alert-custom`;
            alertElement.textContent = message;
            alertElement.style.display = 'block';
            
            setTimeout(() => {
                alertElement.style.display = 'none';
            }, 5000);
        }
        
        function handleStudentLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('student-username').value;
            const password = document.getElementById('student-password').value;
            
            const validStudents = [
                { username: 'group1', password: 'password123' },
                { username: 'group2', password: 'password123' },
                { username: 'cs101', password: 'password123' }
            ];
            
            const isValid = validStudents.some(student => 
                student.username === username && student.password === password
            );
            
            if (isValid) {
                localStorage.setItem('kc_user', JSON.stringify({
                    username: username,
                    role: 'student',
                    name: 'Студент группы ' + username
                }));
                window.location.href = 'student_dashboard.html';
            } else {
                showAlert('student', 'Неверные учетные данные. Попробуйте group1 / password123');
            }
        }
        
        function handleTeacherLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('teacher-username').value;
            const password = document.getElementById('teacher-password').value;
            
            const validTeachers = [
                { username: 'admin', password: 'admin123' },
                { username: 'teacher1', password: 'teacher123' },
                { username: 'teacher2', password: 'teacher123' }
            ];
            
            const isValid = validTeachers.some(teacher => 
                teacher.username === username && teacher.password === password
            );
            
            if (isValid) {
                localStorage.setItem('kc_user', JSON.stringify({
                    username: username,
                    role: 'teacher',
                    name: 'Преподаватель ' + username
                }));
                window.location.href = 'teacher_dashboard.html';
            } else {
                showAlert('teacher', 'Неверные учетные данные. Попробуйте admin / admin123');
            }
        }
    </script>
</body>
</html>
